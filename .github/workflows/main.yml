name: Build Reel Upscaler APK

# Jab bhi main branch par code push ho, ya haath se chalaya jaye,
# tab ye workflow debug APK banata hai.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout karo
        uses: actions/checkout@v4

      - name: JDK 17 set karo
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7 set karo
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Debug APK banao
        run: gradle assembleDebug --stacktrace

      - name: APK artifact upload karo
        uses: actions/upload-artifact@v4
        with:
          name: Reel-Upscaler-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
